<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Site 11 - Mobile Layout Overflow</title>
    <style>
        body { margin: 0; padding: 0; }
        .wide-card { width: 900px; background: #ffebeb; padding: 20px; border: 2px solid #ff4d4d; }
    </style>
</head>
<body>
    <main>
        <h1>AURA Test Site 11: Horizontal Mobile Layout Overflow</h1>
        <div class="wide-card">
            <h2>Non-responsive Fixed Container</h2>
            <p>This element has a hardcoded width of 900px, breaking mobile viewports and causing horizontal scroll and clipped content.</p>
        </div>
    </main>
</body>
